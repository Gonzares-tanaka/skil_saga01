<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SPARK | Game Boy風RPG Prototype</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0f380f; color: #e5edc4; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { width: min(100%, 900px); padding: 14px; box-sizing: border-box; text-align: center; }
    h1 { margin: 0 0 8px; font-size: clamp(1.35rem, 5vw, 2.1rem); }
    p { line-height: 1.55; }
    .notice { color: #bbce86; font-size: .9rem; }
    button { border: 2px solid #e5edc4; border-radius: 8px; padding: 12px 28px; background: #9bbc0f; color: #0f380f; font-weight: 800; font-size: 1rem; cursor: pointer; }
    #game { display: none; width: 100%; height: min(78svh, 680px); margin-top: 10px; border: 2px solid #9bbc0f; background: #0f380f; box-sizing: border-box; }
    #game:focus { outline: 2px solid #9bbc0f; }
    .controls { margin: 14px auto 0; max-width: 620px; font-size: .9rem; }
    @media (pointer: coarse) { main { padding: 7px; } #game { height: 80svh; margin-top: 6px; } .intro { font-size: .85rem; margin: 6px 0; } .playing .intro { display: none; } }
  </style>
</head>
<body>
  <main>
    <h1>SPARK</h1>
    <p class="notice">GAME BOY風 RPG PROTOTYPE</p>
    <p class="intro">ダンジョン最奥のボスを倒そう。技を閃いてスキル収集率100%を目指せ。使い切ってMASTEREDした攻撃技は、再取得すると威力が上がる。</p>
    <button id="play" type="button">PLAY / ゲームを開始</button>
    <iframe id="game" title="SPARK RPG PROTOTYPE" allow="fullscreen"></iframe>
    <p class="controls">スマートフォン：画面下の十字キーで移動・選択、Aで決定・調べる、Bで戻る・探索メニュー。<br>PC：矢印キーで移動・選択、ZキーがA、XキーがBです。</p>
    <p class="notice">感想・不具合はGitHub Issuesへお願いします。ブラウザを閉じると進行状況は失われます。</p>
  </main>
  <script>
    const play = document.querySelector('#play');
    const game = document.querySelector('#game');
    play.addEventListener('click', () => {
      game.src = 'game.html';
      game.style.display = 'block';
      play.hidden = true;
      document.querySelector('main').classList.add('playing');
      game.focus();
    }, { once: true });
  </script>
</body>
</html>
