<!doctype html>
<script>
// Loaded before Pyxel's Web runtime. Audio failures never affect game input.
(() => {
  const contexts = new Set();
  const wrappers = new Map();
  const events = [];
  for (const name of ["AudioContext", "webkitAudioContext"]) {
    const Native = window[name];
    if (typeof Native !== "function") continue;
    if (!wrappers.has(Native)) {
      wrappers.set(Native, new Proxy(Native, {
        construct(target, args, newTarget) {
          const context = Reflect.construct(target, args, newTarget);
          contexts.add(context);
          return context;
        }
      }));
    }
    try { window[name] = wrappers.get(Native); } catch (_) { /* read-only browser alias */ }
  }

  function audioContext() {
    const sdl = window.SDL2?.audioContext || window.Module?.SDL2?.audioContext;
    if (sdl) return sdl;
    return [...contexts].reverse().find(context => context.state !== "closed") ||
           [...contexts].reverse()[0] || null;
  }

  window.sparkAudioState = () => audioContext()?.state || "unavailable";
  window.sparkAudioEvents = events;
  window.sparkResumeAudio = () => {
    const context = audioContext();
    if (!context || context.state === "running" || context.state === "closed") return;
    try {
      Promise.resolve(context.resume()).then(
        () => record("resume"),
        error => record("resume-failed:" + String(error))
      );
    } catch (error) {
      record("resume-failed:" + String(error));
    }
  };

  function releaseButtons() {
    if (typeof _virtualGamepadStates !== "undefined") {
      _virtualGamepadStates.fill(false);
    }
  }

  function record(event) {
    const line = event + " hidden=" + document.hidden + " audio=" + window.sparkAudioState();
    events.push(line);
    if (events.length > 40) events.shift();
    console.info("[SPARK] " + line);
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) releaseButtons();
    record("visibilitychange");
  });
  window.addEventListener("pagehide", () => { releaseButtons(); record("pagehide"); });
  window.addEventListener("pageshow", () => record("pageshow"));
  window.addEventListener("blur", () => { releaseButtons(); record("blur"); });
  window.addEventListener("focus", () => record("focus"));
  document.addEventListener("pointerdown", window.sparkResumeAudio, { capture: true });
  document.addEventListener("keydown", window.sparkResumeAudio, { capture: true });
})();

// Explicit suspend only. Normal GUILD saves keep their existing localStorage key.
// A readwrite transaction compares and consumes one record atomically across tabs.
(() => {
  const database = 'skill_seekers_suspend_v1';
  const storeName = 'checkpoint';
  window.sparkSuspendStore = {
    start(operation, payload) {
      const job = { done: false, result: null, error: '' };
      let db = null, tx = null, reason = '', timer;
      const finish = (result, error = '') => {
        if (job.done) return;
        job.result = result; job.error = error; job.done = true;
        clearTimeout(timer);
        if (db) db.close();
      };
      timer = setTimeout(() => {
        reason = '中断用の保存領域が応答しません';
        if (tx) {
          // If commit already won, abort throws and oncomplete is queued.
          // Let that event report success; never call a committed consume a
          // failure after its checkpoint has already been deleted.
          try { tx.abort(); } catch (_) { /* Completion/abort will settle the job. */ }
          return;
        }
        finish(null, reason);
      }, 10000);
      try {
        if (!['exists', 'read', 'write', 'consume'].includes(operation)) throw new Error('operation');
        const request = indexedDB.open(database, 1);
        request.onupgradeneeded = () => request.result.createObjectStore(storeName);
        request.onerror = () => finish(null, '中断用の保存領域を開けません');
        request.onblocked = () => finish(null, '別のタブが中断用の保存領域を使用中です');
        request.onsuccess = () => {
          db = request.result;
          if (job.done) { db.close(); return; }
          try {
            tx = db.transaction(storeName, ['write', 'consume'].includes(operation) ? 'readwrite' : 'readonly');
            const store = tx.objectStore(storeName);
            let result = true;
            tx.oncomplete = () => finish(result);
            tx.onerror = () => { reason ||= '中断データを処理できません'; };
            tx.onabort = () => finish(null, reason || '中断データを処理できません');
            if (operation === 'write') {
              if (typeof payload !== 'string') throw new Error('payload');
              store.put(payload, 'current');
            } else {
              const read = store.get('current');
              read.onsuccess = () => {
                try {
                  const raw = read.result;
                  if (operation === 'exists') result = typeof raw === 'string';
                  else if (typeof raw !== 'string') {
                    reason = '中断データがありません'; tx.abort();
                  } else if (operation === 'read') result = raw;
                  else if (raw !== payload) {
                    reason = '中断データが変更されました'; tx.abort();
                  } else store.delete('current');
                } catch (_) {
                  reason = '中断データを消去できません';
                  try { tx.abort(); } catch (_) { finish(null, reason); }
                }
              };
            }
          } catch (_) {
            if (tx) { try { tx.abort(); } catch (_) {} }
            finish(null, '中断データを処理できません');
          }
        };
      } catch (_) { finish(null, '中断用の保存領域を使用できません'); }
      return job;
    }
  };
})();

</script>

<style>
  html, body { margin: 0; background: #0f380f; -webkit-user-select: none; user-select: none; }
  #gb-controls { display: none; }
  @media (pointer: coarse) {
    :root {
      --pad-size: clamp(36px, 11vw, 42px);
      --pad-gap: 4px;
      --controls-height: calc(var(--pad-size) + var(--pad-size) + var(--pad-size) + 16px);
    }
    #pyxel-screen { height: calc(100% - var(--controls-height)) !important; background: #0f380f !important; }
    #gb-controls {
      position: fixed; inset: auto 0 0; height: var(--controls-height); z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      box-sizing: border-box; padding: 4px clamp(8px, 4vw, 20px);
      background: #244723; touch-action: none; -webkit-touch-callout: none;
    }
    #gb-controls button {
      width: var(--pad-size); height: var(--pad-size); padding: 0;
      border: 2px solid #c8da91; border-radius: 10px;
      background: #476d49; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #gb-controls button:active { background: #9bbc0f; }
    #gb-dpad {
      display: grid; grid-template-columns: repeat(3, var(--pad-size));
      grid-template-rows: repeat(3, var(--pad-size)); gap: var(--pad-gap);
      flex: none;
    }
    #gb-dpad .up { grid-column: 2; grid-row: 1; }
    #gb-dpad .left { grid-column: 1; grid-row: 2; }
    #gb-dpad .right { grid-column: 3; grid-row: 2; }
    #gb-dpad .down { grid-column: 2; grid-row: 3; }
    #gb-actions { display: flex; gap: clamp(8px, 3vw, 16px); align-items: center; }
    .gb-action { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .gb-action span { color: #e5edc4; font: bold 15px system-ui; pointer-events: none; }
    #gb-actions button { width: clamp(48px, 16vw, 62px); height: clamp(48px, 16vw, 62px); border-radius: 50%; }
  }
</style>
<div id="gb-controls" aria-label="ゲーム操作">
  <div id="gb-dpad" aria-label="D-PAD">
    <button type="button" class="up" data-gb="up" aria-label="上"></button>
    <button type="button" class="left" data-gb="left" aria-label="左"></button>
    <button type="button" class="right" data-gb="right" aria-label="右"></button>
    <button type="button" class="down" data-gb="down" aria-label="下"></button>
  </div>
  <div id="gb-actions">
    <div class="gb-action"><span aria-hidden="true">B</span><button type="button" data-gb="b" aria-label="B キャンセル・メニュー"></button></div>
    <div class="gb-action"><span aria-hidden="true">A</span><button type="button" data-gb="a" aria-label="A 決定・調べる"></button></div>
  </div>
</div>
<script>
  // Indices are Pyxel 2.9.9's official virtual GAMEPAD1 D-PAD / A / B bits.
  const gbButtons = { up: 0, down: 1, left: 2, right: 3, a: 4, b: 5 };
  for (const button of document.querySelectorAll('#gb-controls button')) {
    const index = gbButtons[button.dataset.gb];
    button.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      button.setPointerCapture(event.pointerId);
      _virtualGamepadStates[index] = true;
    });
    const release = (event) => {
      event.preventDefault();
      _virtualGamepadStates[index] = false;
    };
    button.addEventListener('pointerup', release);
    button.addEventListener('pointercancel', release);
    button.addEventListener('lostpointercapture', release);
  }
  window.addEventListener('blur', () => _virtualGamepadStates.fill(false));
</script>
